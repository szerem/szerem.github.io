apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-web-b
spec:
  replicas: 5
  selector:
    matchLabels:
      app: k8s-web-b
  template:
    metadata:
      labels:
        app: k8s-web-b
    spec:
      containers:
      - name: k8s-web-b
        image: szerem/k8s-web 
        resources:
          limits:
            memory: "128Mi"
            cpu: "250m"
        ports:
        - containerPort: 3000

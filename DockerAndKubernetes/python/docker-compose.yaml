version: "3"
services:
  frontend:
    stdin_open: true
    tty: true
    build: ./my-app
    ports:
      - 3000:3000
      - 8080:3000
    volumes:
      - /app/node_modules
      - ./my-app/:/app
  backend:
    build: ./api
    env_file:
      - /api/.env.local
    ports:
      - 5050:5050
    volumes:
      - ./api/:/app
